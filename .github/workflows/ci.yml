name: CI

on:
  # No branch filter: stacked PRs (whose base is another feature branch) need CI too.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pnpm version comes from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Image budget
        run: pnpm run check.images

      # `qwik build` type-checks and lints in parallel with the client and
      # static-site builds, so this one step covers all four checks.
      - name: Build (type check + lint + static site)
        run: pnpm run build

      # Serves dist/ and drives it in headless Firefox (preinstalled on the
      # runner): hydration, marquee, toggles, fonts, third-party requests, console.
      - name: Browser smoke test
        run: pnpm run test.smoke
